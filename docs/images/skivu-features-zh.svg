 <text x="371" y="41" font-size="12" text-anchor="end" fill="#6c809c" letter-spacing="1.5">01</text>
 <text x="20" y="94" font-size="16" font-weight="650" fill="#203751" letter-spacing=".65">选择此刻的模型</text>
 <text x="20" y="116" font-size="14" fill="#536c86">把适合此刻的模型，放在同一个入口。</text>
 <text x="20" y="135" font-size="11.5" fill="#6c809c">OpenAI-compatible · Responses · Claude · Gemini</text>
 </g><g transform="translate(440 24)">
 <rect width="400" height="150" rx="19" fill="#fff" fill-opacity=".82" stroke="#cfdbeb"/>
 <rect x="18" y="19" width="47" height="47" rx="15" fill="#e5f0f7"/>
