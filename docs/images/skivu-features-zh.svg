 <text x="371" y="41" font-size="12" text-anchor="end" fill="#6c809c" letter-spacing="1.5">05</text>
 <text x="20" y="94" font-size="16" font-weight="650" fill="#203751" letter-spacing=".65">为连接添一种声音</text>
 <text x="20" y="116" font-size="14" fill="#536c86">为陪伴选择声音，也留出打断的自由。</text>
