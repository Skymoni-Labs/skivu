 <text x="371" y="41" font-size="12" text-anchor="end" fill="#6c809c" letter-spacing="1.5">03</text>
 <text x="20" y="94" font-size="16" font-weight="650" fill="#203751" letter-spacing=".65">让界面更像你</text>
 <text x="20" y="116" font-size="14" fill="#536c86">从文字到光影，每一处都可以调整。</text>
 <text x="20" y="135" font-size="11.5" fill="#6c809c">玻璃 · 字体 · 颜色 · 背景</text>
 </g><g transform="translate(24 192)">
 <rect width="400" height="150" rx="19" fill="#fff" fill-opacity=".82" stroke="#cfdbeb"/>
