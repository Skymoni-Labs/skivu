 <text x="371" y="41" font-size="12" text-anchor="end" fill="#6c809c" letter-spacing="1.5">06</text>
 <text x="20" y="94" font-size="16" font-weight="650" fill="#203751" letter-spacing=".65">同一角色，不同话题</text>
 <text x="20" y="116" font-size="14" fill="#536c86">让每段对话，拥有独立的上下文。</text>
 <text x="20" y="135" font-size="11.5" fill="#6c809c">独立历史 · 草稿 · 本地备份</text>
