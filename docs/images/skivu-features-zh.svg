 <text x="371" y="41" font-size="12" text-anchor="end" fill="#6c809c" letter-spacing="1.5">02</text>
 <text x="20" y="94" font-size="16" font-weight="650" fill="#203751" letter-spacing=".65">让角色拥有个性</text>
 <text x="20" y="116" font-size="14" fill="#536c86">为不同角色，保留各自的性格与故事。</text>
 <text x="20" y="135" font-size="11.5" fill="#6c809c">角色卡 · 自定义头像 · 多段独立会话</text>
 </g><g transform="translate(856 24)">
 <rect width="400" height="150" rx="19" fill="#fff" fill-opacity=".82" stroke="#cfdbeb"/>
